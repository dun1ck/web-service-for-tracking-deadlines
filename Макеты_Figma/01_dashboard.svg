        <text x="16" y="28" font-size="16">⚡</text>
        <text x="44" y="28" fill="#FFFFFF" font-size="14" font-weight="600">Главный дашборд</text>
      </g>
      <g id="NavItem-calendar" transform="translate(0, 52)">
        <rect width="228" height="44" rx="8" fill="transparent" />
        
        <text x="16" y="28" font-size="16">📅</text>
        <text x="44" y="28" fill="#94A3B8" font-size="14" font-weight="500">Календарь дедлайнов</text>
        <rect x="175" y="12" width="42" height="20" rx="10" fill="#8B5CF6" />
        <text x="196" y="26" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle">N(d)≥3</text>
      </g>
      <g id="NavItem-subjects" transform="translate(0, 104)">
