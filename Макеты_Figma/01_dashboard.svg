      <line x1="0" y1="0" x2="200" y2="0" stroke="#F4F4F5" />
      <rect x="0" y="16" width="32" height="32" rx="16" fill="#F4F4F5" stroke="#E4E4E7" />
      <text x="16" y="37" fill="#18181B" font-size="11" font-weight="600" text-anchor="middle">ДК</text>
      <text x="42" y="30" fill="#18181B" font-size="12" font-weight="500">Данила Кабердин</text>
      <text x="42" y="44" fill="#71717A" font-size="11">Студент • ПГ-1</text>
    </g>
  </g>


  <!-- Header -->
  <g id="Header" transform="translate(240, 0)">
    <rect width="1200" height="70" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
    <text x="32" y="34" fill="#18181B" font-size="18" font-weight="600" letter-spacing="-0.3">Обзор дедлайнов</text>
    <text x="32" y="52" fill="#71717A" font-size="12">Осенний семестр 2026/2027 • Учебная группа 921701</text>
    
    <!-- Action Button -->
    <g id="HeaderAction" transform="translate(980, 18)">
      <rect width="140" height="34" rx="6" fill="#18181B" />
      <text x="70" y="21" fill="#FFFFFF" font-size="12" font-weight="500" text-anchor="middle">+ Сдать работу</text>
    </g>

  </g>

  <!-- Main Area -->
  <g id="DashboardBody" transform="translate(272, 94)">
    
    <!-- Clean Minimal KPI Cards -->
    <g id="KpiCards">
      <!-- KPI 1 -->
      <g id="Kpi-1">
        <rect width="255" height="84" rx="8" fill="#FFFFFF" stroke="#E5E7EB" />
        <text x="20" y="30" fill="#71717A" font-size="11" font-weight="500">АКТИВНЫЕ ЗАДАНИЯ</text>
        <text x="20" y="62" fill="#18181B" font-size="24" font-weight="600">3 работы</text>
      </g>
      
      <!-- KPI 2 -->
      <g id="Kpi-2" transform="translate(270, 0)">
        <rect width="255" height="84" rx="8" fill="#FFFFFF" stroke="#E5E7EB" />
        <text x="20" y="30" fill="#71717A" font-size="11" font-weight="500">НА ВЕРИФИКАЦИИ СТАРОСТОЙ</text>
        <text x="20" y="62" fill="#18181B" font-size="24" font-weight="600">1 работа</text>
      </g>
      
      <!-- KPI 3 -->
      <g id="Kpi-3" transform="translate(540, 0)">
        <rect width="255" height="84" rx="8" fill="#FFFFFF" stroke="#E5E7EB" />
        <text x="20" y="30" fill="#71717A" font-size="11" font-weight="500">ЗАЧТЕНО РАБОТ</text>
        <text x="20" y="62" fill="#18181B" font-size="24" font-weight="600">14 / 22 <tspan fill="#71717A" font-size="14" font-weight="400">(64%)</tspan></text>
      </g>
      
      <!-- KPI 4 -->
      <g id="Kpi-4" transform="translate(810, 0)">
        <rect width="255" height="84" rx="8" fill="#FFFFFF" stroke="#E5E7EB" />
        <text x="20" y="30" fill="#71717A" font-size="11" font-weight="500">БЛИЖАЙШИЙ СРОК</text>
        <text x="20" y="62" fill="#DC2626" font-size="20" font-weight="600">Сегодня, 23:59</text>
      </g>
    </g>
    
    <!-- Main Content Section: Task Table (730px) & Right Column (335px) -->
    <g id="TwoColumns" transform="translate(0, 108)">
      
      <!-- Task Table Card -->
      <g id="TaskTableCard">
        <rect width="730" height="660" rx="8" fill="#FFFFFF" stroke="#E5E7EB" />
        
        <!-- Table Header -->
        <text x="24" y="34" fill="#18181B" font-size="15" font-weight="600">Текущие задания</text>
        <text x="24" y="52" fill="#71717A" font-size="12">Приоритет сроков: Персональный → Подгруппа → Общий</text>
        
        <g transform="translate(24, 76)">
          <line x1="0" y1="0" x2="682" y2="0" stroke="#F4F4F5" />
          <text x="0" y="20" fill="#A1A1AA" font-size="11" font-weight="500">ПРЕДМЕТ И ЗАДАНИЕ</text>
          <text x="270" y="20" fill="#A1A1AA" font-size="11" font-weight="500">ВАРИАНТ</text>
          <text x="360" y="20" fill="#A1A1AA" font-size="11" font-weight="500">СРОК</text>
          <text x="470" y="20" fill="#A1A1AA" font-size="11" font-weight="500">СТАТУС</text>
          <text x="590" y="20" fill="#A1A1AA" font-size="11" font-weight="500">ДЕЙСТВИЕ</text>
          <line x1="0" y1="32" x2="682" y2="32" stroke="#E5E7EB" />
        </g>
        
        <!-- Row 1: ОС ЛР3 -->
        <g id="Row-1" transform="translate(24, 124)">
          <text x="0" y="20" fill="#18181B" font-size="13" font-weight="600">Операционные системы</text>
          <text x="0" y="38" fill="#71717A" font-size="12">Лабораторная работа №3</text>
          
          <text x="270" y="28" fill="#18181B" font-size="12">Вар. 7</text>
          
          <text x="360" y="20" fill="#DC2626" font-size="12" font-weight="500">Сегодня 23:59</text>
          <rect x="360" y="28" width="80" height="16" rx="4" fill="#F4F4F5" />
          <text x="400" y="40" fill="#71717A" font-size="10" font-weight="500" text-anchor="middle">Персональный</text>
          
          <!-- Status Pill: В процессе -->
          <rect x="470" y="16" width="86" height="22" rx="4" fill="#F4F4F5" />
          <circle cx="482" cy="27" r="3" fill="#71717A" />
          <text x="492" y="31" fill="#18181B" font-size="11" font-weight="500">В процессе</text>
          
          <!-- Action Link -->
          <rect x="590" y="14" width="76" height="26" rx="4" fill="#18181B" />
          <text x="628" y="31" fill="#FFFFFF" font-size="11" font-weight="500" text-anchor="middle">Сдать</text>
          
          <line x1="0" y1="56" x2="682" y2="56" stroke="#F4F4F5" />
        </g>
        
        <!-- Row 2: СПО Практика 4 -->
        <g id="Row-2" transform="translate(24, 196)">
          <text x="0" y="20" fill="#18181B" font-size="13" font-weight="600">Системное ПО</text>
          <text x="0" y="38" fill="#71717A" font-size="12">Практическая работа №4</text>
          
          <text x="270" y="28" fill="#18181B" font-size="12">Вар. 1</text>
          
          <text x="360" y="20" fill="#18181B" font-size="12">26 окт, 23:59</text>
          <rect x="360" y="28" width="76" height="16" rx="4" fill="#F4F4F5" />
          <text x="398" y="40" fill="#71717A" font-size="10" font-weight="500" text-anchor="middle">Подгруппа 1</text>
          
          <!-- Status Pill: Не начато -->
          <rect x="470" y="16" width="78" height="22" rx="4" fill="#F4F4F5" />
          <circle cx="482" cy="27" r="3" fill="#A1A1AA" />
          <text x="492" y="31" fill="#71717A" font-size="11" font-weight="500">Не начато</text>
          
          <rect x="590" y="14" width="76" height="26" rx="4" fill="#FFFFFF" stroke="#E5E7EB" />
          <text x="628" y="31" fill="#18181B" font-size="11" font-weight="500" text-anchor="middle">Открыть</text>
          
          <line x1="0" y1="56" x2="682" y2="56" stroke="#F4F4F5" />
        </g>
        
        <!-- Row 3: Базы данных КР -->
        <g id="Row-3" transform="translate(24, 268)">
          <text x="0" y="20" fill="#18181B" font-size="13" font-weight="600">Базы данных</text>
          <text x="0" y="38" fill="#71717A" font-size="12">Курсовая работа • Схема ERD</text>
          
          <text x="270" y="28" fill="#18181B" font-size="12">Общий</text>
          
          <text x="360" y="20" fill="#18181B" font-size="12">29 окт, 18:00</text>
          <rect x="360" y="28" width="60" height="16" rx="4" fill="#F4F4F5" />
          <text x="390" y="40" fill="#71717A" font-size="10" font-weight="500" text-anchor="middle">Общий</text>
          
          <!-- Status Pill: На проверке -->
          <rect x="470" y="16" width="98" height="22" rx="4" fill="#FFFBEB" />
          <circle cx="482" cy="27" r="3" fill="#D97706" />
          <text x="492" y="31" fill="#92400E" font-size="11" font-weight="500">На проверке</text>
          
          <rect x="590" y="14" width="76" height="26" rx="4" fill="#FFFFFF" stroke="#E5E7EB" />
          <text x="628" y="31" fill="#18181B" font-size="11" font-weight="500" text-anchor="middle">Детали</text>
          
          <line x1="0" y1="56" x2="682" y2="56" stroke="#F4F4F5" />
        </g>
        
        <!-- Row 4: Компьютерные сети ЛР2 (Зачтено) -->
        <g id="Row-4" transform="translate(24, 340)">
          <text x="0" y="20" fill="#18181B" font-size="13" font-weight="600">Компьютерные сети</text>
          <text x="0" y="38" fill="#71717A" font-size="12">Лабораторная работа №2</text>
          
          <text x="270" y="28" fill="#18181B" font-size="12">Вар. 3</text>
          <text x="360" y="28" fill="#71717A" font-size="12">Сдано 20 окт</text>
          
          <!-- Status Pill: Зачтено -->
          <rect x="470" y="16" width="76" height="22" rx="4" fill="#F0FDF4" />
          <circle cx="482" cy="27" r="3" fill="#16A34A" />
          <text x="492" y="31" fill="#15803D" font-size="11" font-weight="500">Зачтено</text>
          
          <text x="610" y="31" fill="#71717A" font-size="11">10 баллов</text>
          <line x1="0" y1="56" x2="682" y2="56" stroke="#F4F4F5" />
        </g>
      </g>
      
      <!-- Right Side Column: Announcements & Workload (335px) -->
      <g id="RightSide" transform="translate(755, 0)">
        
        <!-- Announcements Feed -->
        <g id="FeedCard">
          <rect width="310" height="340" rx="8" fill="#FFFFFF" stroke="#E5E7EB" />
          <text x="20" y="32" fill="#18181B" font-size="14" font-weight="600">Объявления старосты</text>
          
          <g transform="translate(20, 52)">
            <text x="0" y="14" fill="#71717A" font-size="11">23 октября, 14:15 • Влад Кахнович</text>
            <text x="0" y="32" fill="#18181B" font-size="12" font-weight="600">Перенос срока по Базам данных</text>
            <text x="0" y="48" fill="#52525B" font-size="11">Срок сдачи эскиза ER-диаграммы перенесён</text>
            <text x="0" y="62" fill="#52525B" font-size="11">на 29 октября по просьбе преподавателя.</text>
            <line x1="0" y1="78" x2="270" y2="78" stroke="#F4F4F5" />
          </g>
          
          <g transform="translate(20, 148)">
            <text x="0" y="14" fill="#71717A" font-size="11">21 октября, 10:00 • Староста</text>
            <text x="0" y="32" fill="#18181B" font-size="12" font-weight="600">Очная защита ЛР №2 по СПО</text>
            <text x="0" y="48" fill="#52525B" font-size="11">В субботу защита пройдёт в ауд. 312.</text>
            <text x="0" y="62" fill="#52525B" font-size="11">Подготовьте отчёты с титульными листами.</text>
            <line x1="0" y1="78" x2="270" y2="78" stroke="#F4F4F5" />
          </g>
          
          <g transform="translate(20, 244)">
            <text x="0" y="14" fill="#71717A" font-size="11">18 октября, 09:30 • Куратор</text>
            <text x="0" y="32" fill="#18181B" font-size="12" font-weight="600">График консультаций</text>
            <text x="0" y="48" fill="#52525B" font-size="11">По четвергам с 15:30 в ауд. 408.</text>
          </g>
        </g>
        
        <!-- Peak Day Notification -->
        <g id="PeakLoadNotice" transform="translate(0, 360)">
          <rect width="310" height="130" rx="8" fill="#FFFFFF" stroke="#E5E7EB" />
          <text x="20" y="30" fill="#18181B" font-size="13" font-weight="600">Пиковая нагрузка: 28 октября</text>
          <text x="20" y="50" fill="#71717A" font-size="11">В среду совпадает 3 дедлайна (N(d) ≥ 3).</text>
          <text x="20" y="66" fill="#71717A" font-size="11">Рекомендуем сдать работу по СПО заранее.</text>
          
          <rect x="20" y="82" width="140" height="28" rx="4" fill="#F4F4F5" />
          <text x="90" y="100" fill="#18181B" font-size="11" font-weight="500" text-anchor="middle">Открыть в календаре</text>
        </g>
      </g>
    </g>
  </g>

</svg>