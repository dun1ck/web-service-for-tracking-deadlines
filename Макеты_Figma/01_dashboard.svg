          <text x="578" y="67" fill="#334155" font-size="13" font-weight="600" text-anchor="middle">Открыть карточку</text>
        </g>
        
        <!-- Task Item 3: Базы данных КР -->
        <g id="TaskItem-3" transform="translate(24, 324)">
