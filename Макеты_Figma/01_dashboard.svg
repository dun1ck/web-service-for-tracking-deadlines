      <rect x="890" y="32" width="194" height="42" rx="8" fill="#FFFFFF" />
      <text x="987" y="58" fill="#4F46E5" font-size="13" font-weight="700" text-anchor="middle">Перейти к сдаче ЛР №3 →</text>
