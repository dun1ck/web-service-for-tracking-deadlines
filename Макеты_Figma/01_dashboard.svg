        <text x="44" y="28" fill="#94A3B8" font-size="14" font-weight="500">Задания и варианты</text>
        <rect x="175" y="12" width="42" height="20" rx="10" fill="#EF4444" />
        <text x="196" y="26" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle">2</text>
      </g>
      <g id="NavItem-announcements" transform="translate(0, 208)">
