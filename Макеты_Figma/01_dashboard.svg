          <rect x="16" y="96" width="190" height="6" rx="3" fill="#EF4444" />
          
          <rect x="520" y="44" width="116" height="36" rx="6" fill="#EF4444" />
          <text x="578" y="67" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle">Сдать отчёт</text>
