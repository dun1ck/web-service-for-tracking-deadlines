<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="1440" height="900" fill="#FAFAFA" />
  <desc>06_Вход_и_Регистрация_Минимализм</desc>
  
  <!-- Centered Card (440px wide) -->
  <g id="AuthContainer" transform="translate(500, 130)">
    
    <!-- Logo -->
    <g transform="translate(0, 0)">
      <rect width="24" height="24" rx="4" fill="#18181B" />
      <rect x="6" y="6" width="12" height="12" rx="2" fill="#FFFFFF" />
      <text x="36" y="18" fill="#18181B" font-size="18" font-weight="600" letter-spacing="-0.3">StudyPulse</text>
    </g>
    
    <text x="0" y="58" fill="#18181B" font-size="20" font-weight="600">Регистрация в группе</text>
    <text x="0" y="78" fill="#71717A" font-size="13">Введите код приглашения старосты для доступа к дедлайнам</text>
    
    <!-- Card Box -->
    <g id="FormCard" transform="translate(0, 100)">
      <rect width="440" height="520" rx="8" fill="#FFFFFF" stroke="#E5E7EB" />
      
      <g transform="translate(24, 24)">
        <!-- Field 1: Invite Code -->
        <text x="0" y="14" fill="#71717A" font-size="11" font-weight="500">ИНВАЙТ-КОД ГРУППЫ</text>
        <rect y="22" width="392" height="38" rx="6" fill="#FFFFFF" stroke="#18181B" />
        <text x="12" y="46" fill="#18181B" font-size="13" font-weight="500">GRP-921701-X8F9</text>
        <text x="320" y="46" fill="#16A34A" font-size="11">✓ Группа 921701</text>
        
        <!-- Field 2: Full Name -->
        <g transform="translate(0, 76)">
          <text x="0" y="14" fill="#71717A" font-size="11" font-weight="500">ФИО СТУДЕНТА</text>
          <rect y="22" width="392" height="38" rx="6" fill="#FFFFFF" stroke="#E5E7EB" />
          <text x="12" y="46" fill="#18181B" font-size="13">Кабердин Данила Сергеевич</text>
        </g>
        
        <!-- Field 3: Subgroup -->
        <g transform="translate(0, 152)">
          <text x="0" y="14" fill="#71717A" font-size="11" font-weight="500">ПОДГРУППА</text>
          <rect y="22" width="392" height="38" rx="6" fill="#FFFFFF" stroke="#E5E7EB" />
          <text x="12" y="46" fill="#18181B" font-size="13">Подгруппа 1</text>
        </g>
        
        <!-- Field 4: Password -->
        <g transform="translate(0, 228)">
          <text x="0" y="14" fill="#71717A" font-size="11" font-weight="500">ПАРОЛЬ</text>
          <rect y="22" width="392" height="38" rx="6" fill="#FFFFFF" stroke="#E5E7EB" />
          <text x="12" y="46" fill="#71717A" font-size="13">••••••••••••••••</text>
        </g>
        
        <!-- Brute-Force & Law Info -->
        <g transform="translate(0, 310)">
          <text x="0" y="14" fill="#71717A" font-size="11">Защита от перебора: 5 попыток → CAPTCHA; 10 → блок 15 мин.</text>
          
          <g transform="translate(0, 28)">
            <rect width="14" height="14" rx="3" fill="#18181B" />
            <text x="7" y="11" fill="#FFFFFF" font-size="9" text-anchor="middle">✓</text>
            <text x="22" y="11" fill="#71717A" font-size="11">Согласие на обработку данных (Закон РБ № 99-З)</text>
          </g>
        </g>
        
        <!-- Submit Button -->
        <rect y="380" width="392" height="40" rx="6" fill="#18181B" />
        <text x="196" y="405" fill="#FFFFFF" font-size="13" font-weight="500" text-anchor="middle">Зарегистрироваться</text>
        
        <!-- Switch to Login -->
        <text x="196" y="450" fill="#71717A" font-size="12" text-anchor="middle">Уже есть аккаунт? <tspan fill="#18181B" font-weight="500">Войти в систему</tspan></text>
      </g>
    </g>
  </g>
</svg>