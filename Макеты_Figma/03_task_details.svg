<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="1440" height="900" fill="#FAFAFA" />
  <desc>03_Детали_Задания_Минимализм</desc>

  <!-- Sidebar -->
  <g id="Sidebar" transform="translate(0, 0)">
    <rect width="240" height="900" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
    
    <!-- Brand -->
    <g id="Brand" transform="translate(24, 28)">
      <rect width="20" height="20" rx="4" fill="#18181B" />
      <rect x="5" y="5" width="10" height="10" rx="2" fill="#FFFFFF" />
      <text x="32" y="16" fill="#18181B" font-size="14" font-weight="600" letter-spacing="-0.2">StudyPulse</text>
      <text x="32" y="30" fill="#71717A" font-size="11">Группа 921701</text>
    </g>
    
    <!-- Nav Items -->
    <g id="NavList" transform="translate(12, 88)">
      <g id="NavItem-dashboard" transform="translate(0, 0)">
        <rect width="216" height="36" rx="6" fill="transparent" />
        <circle cx="16" cy="18" r="3" fill="#A1A1AA" />
        <text x="30" y="22" fill="#71717A" font-size="13" font-weight="400">Обзор</text>
      </g>
      <g id="NavItem-calendar" transform="translate(0, 42)">
        <rect width="216" height="36" rx="6" fill="transparent" />
        <circle cx="16" cy="18" r="3" fill="#A1A1AA" />
        <text x="30" y="22" fill="#71717A" font-size="13" font-weight="400">Календарь</text>
        <rect x="164" y="9" width="44" height="18" rx="4" fill="#F4F4F5" />
        <text x="186" y="22" fill="#71717A" font-size="10" font-weight="500" text-anchor="middle">3</text>
      </g>
      <g id="NavItem-subjects" transform="translate(0, 84)">
        <rect width="216" height="36" rx="6" fill="transparent" />
        <circle cx="16" cy="18" r="3" fill="#A1A1AA" />
        <text x="30" y="22" fill="#71717A" font-size="13" font-weight="400">Дисциплины</text>
      </g>
      <g id="NavItem-tasks" transform="translate(0, 126)">
        <rect width="216" height="36" rx="6" fill="#F4F4F5" />
        <circle cx="16" cy="18" r="3" fill="#18181B" />
        <text x="30" y="22" fill="#18181B" font-size="13" font-weight="600">Задания</text>
        <rect x="164" y="9" width="44" height="18" rx="4" fill="#F4F4F5" />
        <text x="186" y="22" fill="#71717A" font-size="10" font-weight="500" text-anchor="middle">2</text>
      </g>
      <g id="NavItem-announcements" transform="translate(0, 168)">
        <rect width="216" height="36" rx="6" fill="transparent" />
        <circle cx="16" cy="18" r="3" fill="#A1A1AA" />
        <text x="30" y="22" fill="#71717A" font-size="13" font-weight="400">Объявления</text>
      </g>
      <g id="NavItem-analytics" transform="translate(0, 210)">
        <rect width="216" height="36" rx="6" fill="transparent" />
        <circle cx="16" cy="18" r="3" fill="#A1A1AA" />
        <text x="30" y="22" fill="#71717A" font-size="13" font-weight="400">Матрица группы</text>
      </g>
      <g id="NavItem-profile" transform="translate(0, 252)">
        <rect width="216" height="36" rx="6" fill="transparent" />
        <circle cx="16" cy="18" r="3" fill="#A1A1AA" />
        <text x="30" y="22" fill="#71717A" font-size="13" font-weight="400">Профиль</text>
      </g>
    </g>
    
    <!-- Footer User Info -->
    <g id="SidebarUser" transform="translate(20, 820)">
      <line x1="0" y1="0" x2="200" y2="0" stroke="#F4F4F5" />
      <rect x="0" y="16" width="32" height="32" rx="16" fill="#F4F4F5" stroke="#E4E4E7" />
      <text x="16" y="37" fill="#18181B" font-size="11" font-weight="600" text-anchor="middle">ДК</text>
      <text x="42" y="30" fill="#18181B" font-size="12" font-weight="500">Данила Кабердин</text>
      <text x="42" y="44" fill="#71717A" font-size="11">Студент • ПГ-1</text>
    </g>
  </g>


  <!-- Header -->
  <g id="Header" transform="translate(240, 0)">
    <rect width="1200" height="70" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
    <text x="32" y="34" fill="#18181B" font-size="18" font-weight="600" letter-spacing="-0.3">Задания / Операционные системы</text>
    <text x="32" y="52" fill="#71717A" font-size="12">Лабораторная работа №3</text>
    
    <!-- Action Button -->
    <g id="HeaderAction" transform="translate(980, 18)">
      <rect width="140" height="34" rx="6" fill="#18181B" />
      <text x="70" y="21" fill="#FFFFFF" font-size="12" font-weight="500" text-anchor="middle">← Назад к списку</text>
    </g>

  </g>

  <g id="TaskDetailsBody" transform="translate(272, 94)">
    
    <!-- Top Metadata Card -->
    <g id="TopMeta">
      <rect width="1065" height="100" rx="8" fill="#FFFFFF" stroke="#E5E7EB" />
      <text x="24" y="34" fill="#18181B" font-size="18" font-weight="600">Лабораторная работа №3: Синхронизация потоков POSIX</text>
      
      <g transform="translate(24, 52)">
        <text x="0" y="16" fill="#71717A" font-size="12">Преподаватель: Сидоров В.П.</text>
        <text x="220" y="16" fill="#71717A" font-size="12">Дедлайн: <tspan fill="#DC2626" font-weight="500">28 октября 23:59</tspan> (Персональный)</text>
        <text x="560" y="16" fill="#71717A" font-size="12">Закреплённый вариант: <tspan fill="#18181B" font-weight="600">Вариант 7</tspan></text>
        <text x="820" y="16" fill="#71717A" font-size="12">Макс. балл: 10</text>
      </g>
    </g>
    
    <!-- Two Columns: Left Requirements (665) & Right Submission (380) -->
    <g id="TaskCols" transform="translate(0, 120)">
      
      <!-- Left: Requirements & Materials -->
      <g id="LeftReqs">
        <rect width="665" height="650" rx="8" fill="#FFFFFF" stroke="#E5E7EB" />
        
        <text x="24" y="36" fill="#18181B" font-size="14" font-weight="600">Требования к выполнению</text>
        <g transform="translate(24, 54)">
          <text x="0" y="16" fill="#52525B" font-size="13">Разработать консольное приложение на C/C++ под Linux,</text>
          <text x="0" y="36" fill="#52525B" font-size="13">моделирующее синхронизацию потоков по варианту №7.</text>
          <text x="0" y="56" fill="#52525B" font-size="13">Использовать примитивы pthread_mutex_t и pthread_cond_t.</text>
        </g>
        
        <text x="24" y="160" fill="#18181B" font-size="14" font-weight="600">Критерии оценивания</text>
        <g transform="translate(24, 180)">
          <text x="0" y="16" fill="#52525B" font-size="12">1. Компиляция без предупреждений (-Wall -Wextra -pthread) — 2 балла</text>
          <text x="0" y="38" fill="#52525B" font-size="12">2. Отсутствие состояния гонки (проверка Helgrind) — 3 балла</text>
          <text x="0" y="60" fill="#52525B" font-size="12">3. Оформленный отчёт с графиками времени работы — 3 балла</text>
          <text x="0" y="82" fill="#52525B" font-size="12">4. Ответы на контрольные вопросы на защите — 2 балла</text>
        </g>
        
        <text x="24" y="300" fill="#18181B" font-size="14" font-weight="600">Методические материалы</text>
        <g transform="translate(24, 320)">
          <!-- File 1 -->
          <rect width="617" height="46" rx="6" fill="#FAFAFA" stroke="#E5E7EB" />
          <text x="16" y="28" fill="#18181B" font-size="12">Методические_указания_ЛР3.pdf</text>
          <text x="340" y="28" fill="#71717A" font-size="11">2.4 МБ</text>
          <text x="540" y="28" fill="#18181B" font-size="11" font-weight="500">Скачать</text>
          
          <!-- File 2 -->
          <g transform="translate(0, 56)">
            <rect width="617" height="46" rx="6" fill="#FAFAFA" stroke="#E5E7EB" />
            <text x="16" y="28" fill="#18181B" font-size="12">Шаблоны_кода_var7.zip</text>
            <text x="340" y="28" fill="#71717A" font-size="11">450 КБ</text>
            <text x="540" y="28" fill="#18181B" font-size="11" font-weight="500">Скачать</text>
          </g>
        </g>
        
        <!-- Starosta Workflow Notice -->
        <g transform="translate(24, 450)">
          <rect width="617" height="60" rx="6" fill="#F4F4F5" />
          <text x="16" y="26" fill="#18181B" font-size="12" font-weight="500">Регламент верификации</text>
          <text x="16" y="44" fill="#71717A" font-size="11">После сдачи староста подтверждает статус «Зачтено» по официальной ведомости.</text>
        </g>
      </g>
      
      <!-- Right: Submission Form -->
      <g id="RightSubmit" transform="translate(685, 0)">
        <rect width="380" height="650" rx="8" fill="#FFFFFF" stroke="#E5E7EB" />
        
        <text x="24" y="36" fill="#18181B" font-size="14" font-weight="600">Сдать решение</text>
        
        <!-- Status -->
        <g transform="translate(24, 54)">
          <text x="0" y="14" fill="#71717A" font-size="11">ТЕКУЩИЙ СТАТУС</text>
          <rect y="22" width="100" height="24" rx="4" fill="#F4F4F5" />
          <text x="50" y="38" fill="#18181B" font-size="11" font-weight="500" text-anchor="middle">В процессе</text>
        </g>
        
        <!-- Minimal Upload Dropzone -->
        <g transform="translate(24, 130)">
          <rect width="332" height="140" rx="6" fill="#FAFAFA" stroke="#D4D4D8" stroke-dasharray="4 4" />
          <text x="166" y="65" fill="#18181B" font-size="13" font-weight="500" text-anchor="middle">Перетащите архив сюда</text>
          <text x="166" y="85" fill="#71717A" font-size="11" text-anchor="middle">ZIP или RAR до 50 МБ</text>
          
          <rect x="116" y="98" width="100" height="26" rx="4" fill="#E4E4E7" />
          <text x="166" y="115" fill="#18181B" font-size="11" font-weight="500" text-anchor="middle">Выбрать файл</text>
        </g>
        
        <!-- Attached File Info -->
        <g transform="translate(24, 290)">
          <rect width="332" height="60" rx="6" fill="#FAFAFA" stroke="#E5E7EB" />
          <text x="14" y="24" fill="#18181B" font-size="12" font-weight="500">kaberdin_os_lab3_var7.zip (1.8 МБ)</text>
          <text x="14" y="44" fill="#16A34A" font-size="11">✓ Проверено: архивы без исполняемых файлов</text>
        </g>
        
        <!-- Note -->
        <g transform="translate(24, 370)">
          <text x="0" y="14" fill="#71717A" font-size="11">КОММЕНТАРИЙ</text>
          <rect y="22" width="332" height="60" rx="6" fill="#FFFFFF" stroke="#E5E7EB" />
          <text x="12" y="44" fill="#52525B" font-size="12">В архиве лежит исходный код и отчёт.pdf</text>
        </g>
        
        <!-- Submit Button -->
        <rect x="24" y="470" width="332" height="38" rx="6" fill="#18181B" />
        <text x="190" y="494" fill="#FFFFFF" font-size="12" font-weight="500" text-anchor="middle">Отправить на проверку</text>
      </g>
    </g>
  </g>

</svg>